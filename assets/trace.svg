<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="34" viewBox="0 0 1200 34" role="img" aria-label="divider"><title>divider</title>
<defs>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.9" fill="#173528"/>
  </pattern>
  <radialGradient id="vign" cx="50%" cy="45%" r="75%">
    <stop offset="0%" stop-color="#0e2019"/>
    <stop offset="100%" stop-color="#0a1712"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="chipg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1b201d"/>
    <stop offset="100%" stop-color="#0d100e"/>
  </linearGradient>
</defs>
<path d="M10 17 H560 V10 H640 V24 H1190" fill="none" stroke="#5e4520" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 17 H560 V10 H640 V24 H1190" fill="none" stroke="#b9853a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 17 H560 V10 H640 V24 H1190" pathLength="100" fill="none" stroke="#ffd98a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 94" stroke-dashoffset="100" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="100;0" dur="3.5s" begin="0s" repeatCount="indefinite"/></path><circle cx="560" cy="10" r="6" fill="#b9853a"/><circle cx="560" cy="10" r="2.5" fill="#050a07"/><circle cx="640" cy="24" r="6" fill="#b9853a"/><circle cx="640" cy="24" r="2.5" fill="#050a07"/></svg>